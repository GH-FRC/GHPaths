plugins {
    id "java"
    // TODO(Phase 0): 版本号按 WPILib VS Code 扩展实际安装的 2026 版核对后固定（ADR-0004 冻结栈）
    id "edu.wpi.first.GradleRIO" version "2026.1.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.ghpaths.Main"

// 部署目标。GradleRIO 2026 的 DeployExtension 只有 targets/cache 两个多态容器
//（无全局 artifacts 块）;FRC artifact 类型注册在各 target 自己的 artifacts 容器上——
// 因此用 target.artifacts.create(name, Class)（2026 线无 roboRIO()/frcJava() 糖方法,
// 2026.1.1 + Gradle 8.11 下实验验证,EXP 见工程日志 2026.8.21）
def deployArtifact = deploy.targets.create("roborio", edu.wpi.first.gradlerio.deploy.roborio.RoboRIO) {
    team = project.property("teamNumber") as int
}.artifacts.create("robotJava", edu.wpi.first.gradlerio.deploy.roborio.FRCJavaArtifact)

// 部署静态文件（src/main/deploy → roboRIO）——Phase 2 放路径文件
deploy.targets.roborio.artifacts.create("deployFiles", edu.wpi.first.deployutils.deploy.artifact.FileTreeArtifact) {
    files = project.fileTree("src/main/deploy")
}

wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// 依赖（vendordeps 由 GradleRIO 按 vendordeps/ 目录自动加载）
dependencies {
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)

    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    simulationDebug wpi.sim.enableDebug()
    simulationRelease wpi.sim.enableRelease()
}

// fat jar：部署到 roboRIO 的最终产物（2026 官方模板）
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from("src/main/java") {
        into "sources"
    }
    from("src/main/deploy") {
        into "deploy"
    }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

deployArtifact.jarTask = jar


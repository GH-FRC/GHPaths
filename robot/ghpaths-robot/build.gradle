//   ✓ 本机 Gradle 8.11 + GradleRIO 2026.1.1 配置期验证通过（deploy DSL 按 2026 实际 API 改写）
//   ✓ gradle compileJava 通过（依赖经 frcmaven/mavenCentral 首次下载）
//   2. GradleRIO 插件版本与 WPILib VS Code 扩展安装的 2026 版一致（2026.1.1）
//   3. vendordeps/PathPlannerLib.json 为官方 2026.1.2 版（审查已核实格式含 frcYear）
//   4. gradle wrapper 由 WPILib VS Code 生成（本仓库未含 wrapper 二进制文件）

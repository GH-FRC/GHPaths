plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.1.1"
    // TODO(Phase 0): 上面版本号按 WPILib VS Code 扩展实际安装的 2026 版核对后固定（ADR-0004 冻结栈）
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.ghpaths.Main"

deploy {
    targets {
        roborio("roborio") {
            team = project.property("teamNumber") as int
        }
    }
    artifacts {
        frcJava("robotJava") {
            targets << "roborio"
        }
    }
}

def deployArtifact = artifacts.deployedJava

wpi.java.deps.wpilib().each { implementation it }
wpi.java.vendor.java().each { implementation it }
wpi.java.deps.vendor.java().each { implementation it }
wpi.sim.addWebsocketSimExtensions().each { simImplementation it }

test {
    useJUnitPlatform()
}

